name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian ${{ matrix.debian }} / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        debian: ['11', '12', '13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and verify Debian package
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
          DEB_MAINTAINER: ${{ github.repository_owner }} <noreply@github.com>
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            --env DEBIAN_FRONTEND=noninteractive \
            --env DEBIAN_VERSION --env BUILD_REF --env BUILD_TAG --env DEB_MAINTAINER \
            "docker.io/library/debian:${DEBIAN_VERSION}-slim" \
            bash -euc '
              if [ "$DEBIAN_VERSION" = 11 ]; then
                printf "%s\n" \
                  "deb http://archive.debian.org/debian bullseye main" \
                  "deb http://archive.debian.org/debian-security bullseye-security main" \
                  > /etc/apt/sources.list
                apt-get -o Acquire::Check-Valid-Until=false update
              else
                apt-get update
              fi
              apt-get install --no-install-recommends -y \
                apache2 apache2-dev build-essential binutils
              version=0.0.0+snapshot
              if [[ "$BUILD_REF" == refs/tags/v* ]]; then
                version=${BUILD_TAG#v}
              fi
              sh packaging/build-deb.sh "$version" "$DEBIAN_VERSION"
              apt-get install --no-install-recommends -y ./dist/*.deb
              a2enmod 444
              apache2ctl configtest
              apache2ctl -M 2>&1 | grep -F "fourfour_module (shared)"
              asset="mod_444-debian${DEBIAN_VERSION}-amd64"
              {
                cat /etc/os-release
                dpkg-query -W apache2-dev libc6
                cc --version
                apxs -q HTTPD_VERSION
              } > "dist/${asset}.buildinfo.txt"
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod_444-debian${{ matrix.debian }}-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mod_444-debian*-amd64
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.deb ./*.buildinfo.txt > SHA256SUMS

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
